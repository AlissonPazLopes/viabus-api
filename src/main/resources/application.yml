server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: viabus-api

  # Configuração do Banco de Dados PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/viabus_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Configuração JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Configuração de Migração Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Configuração do Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Configuração de Cache
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

# Logs da Aplicação
logging:
  level:
    root: INFO
    com.viabus.api: DEBUG
    org.hibernate.SQL: DEBUG
